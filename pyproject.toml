[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jinyiquant"
version = "0.1.0"
description = "Reproducible local research workflow for Jinyi Quant"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.2,<2.4", "pandas>=2.2,<3", "pyarrow>=20,<24",
  "pydantic>=2.10,<3", "psutil>=7,<8"
]

[project.scripts]
jinyi = "jinyiquant.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/jinyiquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
