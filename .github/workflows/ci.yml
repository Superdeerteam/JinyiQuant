name: Engineering checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.17"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Check repository contains no datasets or generated artifacts
        run: uv run --locked python scripts/check_repository_payload.py --mode tracked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check behavior
        run: uv run --locked pytest -q --basetemp="${{ runner.temp }}/jinyi-pytest-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Check dependency consistency
        run: uv pip check
      - name: Exercise the unified pipeline and comparison workflow
        run: uv run --locked python scripts/acceptance.py --output "${{ runner.temp }}/jinyi-acceptance-${{ github.run_id }}-${{ github.run_attempt }}"
