name: Engineering checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tlob-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.17"
          python-version: "3.11"
      - name: Create isolated TLOB environment
        shell: bash
        run: |
          uv venv --python 3.11 .venv-tlob
          uv pip sync --python .venv-tlob modified_tlob/requirements-cpu.lock.txt modified_tlob/requirements-dev.lock.txt
          if [ "$RUNNER_OS" = "Windows" ]; then echo "TLOB_PY=.venv-tlob/Scripts/python.exe" >> "$GITHUB_ENV"; else echo "TLOB_PY=.venv-tlob/bin/python" >> "$GITHUB_ENV"; fi
      - name: Verify optional backend behavior and complete offline package
        shell: bash
        run: |
          "$TLOB_PY" -m pytest -q --basetemp scratch/tlob-ci-tests
          "$TLOB_PY" scripts/tlob_acceptance.py --output runs/tlob-ci-acceptance
          uv pip check --python .venv-tlob
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.17"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Check repository contains no datasets or generated artifacts
        run: uv run --locked python scripts/check_repository_payload.py --mode tracked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check behavior
        run: uv run --locked pytest -q --basetemp="${{ runner.temp }}/jinyi-pytest-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Check dependency consistency
        run: uv pip check
      - name: Exercise the unified pipeline and comparison workflow
        run: uv run --locked python scripts/acceptance.py --output "${{ runner.temp }}/jinyi-acceptance-${{ github.run_id }}-${{ github.run_attempt }}"
